[project]
name = "eagv3-week6"
version = "0.1.0"
description = "EAGV3 Week 6 — Cognitive agent with memory/perception/decision/action layers"
requires-python = ">=3.11"
dependencies = [
    # MCP SDK (client + server / FastMCP)
    "mcp[cli]>=1.0",
    # Pydantic v2 for typed contracts
    "pydantic>=2.6",
    # HTTP client (mcp_server currency tool + gateway client)
    "httpx>=0.27",
    # Environment loading
    "python-dotenv>=1.0",
    # Web search tools (mcp_server)
    "tavily-python>=0.3",
    "ddgs>=0.6", # renamed from duckduckgo-search; exposes ddgs.DDGS
    # URL fetch via headless Chromium (mcp_server fetch_url)
    "crawl4ai>=0.4",
]

[tool.uv]
# Run the agent:  uv run python agent6.py "your query"
# Clean state:   uv run python clean.py
